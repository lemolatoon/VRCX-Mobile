name: Container Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-24.04
    outputs:
      push: ${{ steps.meta.outputs.push }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Compute metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service.name }} (${{ matrix.platform.arch }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: vrcx-proxy
            image: ghcr.io/lemolatoon/vrcx-mobile-proxy
            context: ./vrcx-server
            dockerfile: ./vrcx-server/cmd/proxy/Dockerfile
          - name: vrcx-collector
            image: ghcr.io/lemolatoon/vrcx-mobile-collector
            context: ./vrcx-server
            dockerfile: ./vrcx-server/cmd/collector/Dockerfile
          - name: vrcx-frontend
            image: ghcr.io/lemolatoon/vrcx-mobile-frontend
            context: .
            dockerfile: ./mobile/Dockerfile
        platform:
          - arch: amd64
            value: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            value: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.value }}
          outputs: ${{ needs.prepare.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', matrix.service.image) || '' }}
          tags: ${{ matrix.service.image }}

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: Publish ${{ matrix.service.name }} manifest
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: vrcx-proxy
            image: ghcr.io/lemolatoon/vrcx-mobile-proxy
          - name: vrcx-collector
            image: ghcr.io/lemolatoon/vrcx-mobile-collector
          - name: vrcx-frontend
            image: ghcr.io/lemolatoon/vrcx-mobile-frontend
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          pattern: digests-${{ matrix.service.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ matrix.service.image }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ matrix.service.image }}:${{ steps.meta.outputs.version }}
