services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vrcx_mobile
      POSTGRES_USER: vrcx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrcx -d vrcx_mobile"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  vrcx-proxy:
    image: ghcr.io/lemolatoon/vrcx-mobile-proxy:latest
    build:
      context: ./vrcx-server
      dockerfile: cmd/proxy/Dockerfile
    environment:
      DATABASE_URL: postgres://vrcx:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/vrcx_mobile
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  vrcx-collector:
    image: ghcr.io/lemolatoon/vrcx-mobile-collector:latest
    build:
      context: ./vrcx-server
      dockerfile: cmd/collector/Dockerfile
    environment:
      DATABASE_URL: postgres://vrcx:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/vrcx_mobile
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
